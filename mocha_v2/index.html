<!doctype html>
<html lang="ro">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Mocha | Meniu</title>
<link rel="icon" type="image/png" sizes="64x64" href="assets/favicon-64.png">
<link rel="apple-touch-icon" href="assets/apple-touch-icon.png">
<link rel="stylesheet" href="assets/fonts.css">
<style>
  :root {
    --bg-top: #8a4f2c;
    --bg-mid: #a86d43;
    --bg-bottom: #7b4325;
    --cream: #fff8ef;
    --cream-soft: rgba(255, 248, 239, .82);
    --caramel-1: #b9814f;
    --caramel-2: #95603a;
    --teal-1: #a88a61;
    --teal-2: #4d8577;
    --dark-1: #3d2f2a;
    --dark-2: #261d1a;
    --shadow: 0 22px 34px -18px rgba(40, 18, 6, .65);
    --serif: "Playfair Display", Georgia, "Times New Roman", serif;
    --sans: Montserrat, "Helvetica Neue", Arial, sans-serif;
  }
  * { box-sizing: border-box; }
  html { scroll-behavior: smooth; }
  body {
    margin: 0;
    min-height: 100vh;
    color: var(--cream);
    font: 400 14px/1.55 var(--sans);
    -webkit-font-smoothing: antialiased;
    background:
      radial-gradient(1100px 700px at 50% 0%, rgba(214, 160, 105, .45), transparent 70%),
      linear-gradient(180deg, var(--bg-top) 0%, var(--bg-mid) 45%, var(--bg-bottom) 100%);
    background-attachment: fixed;
    overflow-x: hidden;
  }
  img { display: block; max-width: 100%; height: auto; }

  /* Decor: coffee rings and beans drawn in CSS */
  .deco { position: fixed; inset: 0; pointer-events: none; z-index: 0; overflow: hidden; }
  .ring { position: absolute; border-radius: 50%; border: 3px solid rgba(60, 28, 10, .16); box-shadow: inset 0 0 0 7px rgba(60, 28, 10, .05); }
  .ring.r1 { width: 260px; height: 260px; right: -90px; top: 52%; }
  .ring.r2 { width: 190px; height: 190px; left: -80px; top: 18%; border-width: 2px; }
  .ring.r3 { width: 120px; height: 120px; left: 7%; bottom: 6%; border-width: 2px; opacity: .7; }
  .bean { position: absolute; width: 16px; height: 22px; border-radius: 50%; background: radial-gradient(circle at 35% 30%, #6b3a20, #3a1c0d 70%); box-shadow: 0 3px 5px rgba(0,0,0,.35); }
  .bean::after { content: ""; position: absolute; left: 50%; top: 3px; bottom: 3px; width: 2px; margin-left: -1px; border-radius: 2px; background: rgba(255, 220, 180, .28); transform: rotate(8deg); }
  .bean.b1 { left: 3%; top: 9%; rotate: -25deg; }
  .bean.b2 { left: 5.5%; top: 11%; rotate: 40deg; scale: .85; }
  .bean.b3 { right: 4%; top: 14%; rotate: 15deg; }
  .bean.b4 { right: 3%; top: 58%; rotate: -50deg; scale: .9; }
  .bean.b5 { right: 6%; top: 62%; rotate: 20deg; scale: .75; }
  .bean.b6 { left: 9%; top: 68%; rotate: 70deg; }

  .wrap { position: relative; z-index: 1; max-width: 1000px; margin: 0 auto; padding: 0 16px; }

  /* Header */
  header { text-align: center; padding: 40px 0 8px; }
  header .logo { width: min(240px, 62vw); margin: 0 auto; filter: drop-shadow(0 6px 10px rgba(40, 15, 0, .35)); }
  header h1 { margin: 34px 0 0; font: 700 clamp(44px, 9vw, 68px)/1.05 var(--serif); letter-spacing: -.5px; text-shadow: 0 4px 16px rgba(40, 15, 0, .3); }

  /* Offer banner */
  .banner { margin: 34px auto 0; max-width: 520px; }
  .banner img { width: 100%; height: auto; border-radius: 18px; box-shadow: var(--shadow); }

  /* Categories */
  main { padding: 34px 0 40px; }
  .cat { margin: 0 0 8px; }
  .cat-head { display: block; width: 100%; padding: 18px 8px 22px; border: 0; background: none; color: var(--cream); cursor: pointer; text-align: center; -webkit-tap-highlight-color: transparent; }
  .cat-head .t { display: inline-block; font: 700 clamp(30px, 6.4vw, 46px)/1.1 var(--serif); letter-spacing: -.3px; text-shadow: 0 3px 12px rgba(40, 15, 0, .25); }
  .cat-head .line { display: block; width: 46px; height: 2px; margin: 12px auto 0; background: var(--cream); opacity: .8; transition: width .25s; }
  .cat-head .hint { display: inline-flex; align-items: center; gap: 6px; margin-top: 10px; font: 500 11px/1 var(--sans); letter-spacing: .14em; text-transform: uppercase; color: var(--cream-soft); }
  .cat-head .hint::after { content: ""; width: 7px; height: 7px; border: solid currentColor; border-width: 0 1.5px 1.5px 0; rotate: 45deg; translate: 0 -2px; transition: rotate .2s, translate .2s; }
  .cat.open .cat-head .hint::after { rotate: -135deg; translate: 0 2px; }
  .cat.open .cat-head .line { width: 80px; }
  .cat-head:focus-visible { outline: 2px solid var(--cream); outline-offset: 4px; border-radius: 12px; }

  .grid { display: none; grid-template-columns: repeat(4, 1fr); gap: 10px; padding: 4px 0 26px; }
  .cat.open .grid { display: grid; }

  .card { position: relative; display: flex; flex-direction: column; align-items: center; justify-content: flex-start; text-align: center; padding: 22px 16px 24px; border-radius: 14px; box-shadow: var(--shadow); background: linear-gradient(180deg, var(--caramel-1), var(--caramel-2)); }
  .card.teal { background: linear-gradient(180deg, var(--teal-1) 0%, var(--teal-2) 85%); }
  .card.dark { background: linear-gradient(180deg, var(--dark-1), var(--dark-2)); }
  .card .img { height: 92px; width: 100%; margin-bottom: 14px; display: flex; align-items: center; justify-content: center; }
  .card .img img { max-height: 92px; width: auto; object-fit: contain; filter: drop-shadow(0 10px 8px rgba(0, 0, 0, .3)); }
  .card .price { font: 600 17px/1 var(--serif); letter-spacing: .2px; }
  .card .price span { font-size: 13px; margin-left: 2px; }
  .card h3 { margin: 6px 0 0; font: 700 21px/1.15 var(--serif); letter-spacing: -.2px; overflow-wrap: anywhere; }
  .card .qty { margin-top: 4px; font: 500 11px/1.3 var(--sans); letter-spacing: .08em; text-transform: uppercase; color: var(--cream-soft); }
  .card p { margin: 10px 0 0; font-size: 12.5px; line-height: 1.6; color: var(--cream-soft); }

  /* Footer */
  footer { text-align: center; padding: 28px 0 56px; }
  footer .logo { width: 130px; margin: 0 auto 18px; opacity: .95; }
  footer .days { font: 700 22px/1.3 var(--serif); }
  footer .hours { margin-top: 4px; color: var(--cream-soft); letter-spacing: .06em; }
  .state { padding: 40px 0; text-align: center; color: var(--cream-soft); }

  @media (max-width: 860px) {
    .grid { grid-template-columns: repeat(3, 1fr); }
  }
  /* Order: floating "Comanda mea" button, tappable cards, toast */
  .order-fab { position: fixed; z-index: 30; top: calc(12px + env(safe-area-inset-top)); right: calc(12px + env(safe-area-inset-right)); display: inline-flex; align-items: center; gap: 8px; padding: 10px 16px 10px 13px; border-radius: 999px; background: var(--cream); color: #3a1f10; text-decoration: none; font: 600 14px/1 var(--sans); box-shadow: 0 8px 22px -6px rgba(30, 10, 0, .55); }
  .order-fab svg { width: 22px; height: 22px; flex: none; }
  .order-fab .badge { min-width: 22px; height: 22px; padding: 0 6px; border-radius: 11px; background: #2e7a62; color: #fff; font: 600 12px/22px var(--sans); text-align: center; }
  .order-fab .badge:empty { display: none; }
  .order-fab.bump { animation: bump .35s ease; }
  @keyframes bump { 40% { transform: scale(1.12); } }
  .card.add { cursor: pointer; transition: transform .12s ease; -webkit-tap-highlight-color: transparent; }
  .card.add:active { transform: scale(.97); }
  .card.add:focus-visible { outline: 2px solid var(--cream); outline-offset: 3px; }
  .card.out .plus { display: none; }
  .card.out .img, .card.out .price { opacity: .5; }
  .card .ask { margin-top: 12px; padding: 5px 11px; border-radius: 999px; background: rgba(255, 248, 239, .92); color: #3a1f10; font: 600 11px/1.2 var(--sans); letter-spacing: .04em; text-transform: uppercase; }
  .card .plus { position: absolute; top: 10px; right: 10px; width: 26px; height: 26px; border-radius: 50%; background: rgba(255, 248, 239, .92); color: #3a1f10; display: grid; place-items: center; font: 600 18px/1 var(--sans); box-shadow: 0 2px 6px rgba(0,0,0,.25); }
  .toast { position: fixed; z-index: 40; left: 50%; bottom: calc(18px + env(safe-area-inset-bottom)); translate: -50% 0; display: flex; align-items: center; justify-content: space-between; gap: 14px; width: min(380px, calc(100vw - 32px)); padding: 12px 14px 12px 18px; border-radius: 12px; background: #261d1a; color: var(--cream); font: 500 14px/1.3 var(--sans); box-shadow: 0 10px 28px rgba(0,0,0,.4); }
  .toast button { border: 0; background: none; color: #f2c58f; font: 600 14px/1 var(--sans); padding: 6px 4px; cursor: pointer; }

  @media (max-width: 620px) {
    .grid { grid-template-columns: repeat(2, 1fr); gap: 8px; }
    .card { padding: 18px 10px 20px; border-radius: 12px; }
    .card .img { height: 76px; margin-bottom: 12px; }
    .card .img img { max-height: 76px; }
    .card h3 { font-size: 18px; }
    .card p { font-size: 12px; }
    header { padding-top: 72px; }
    header h1 { margin-top: 26px; }
    .ring.r1 { width: 180px; height: 180px; right: -110px; }
    .bean.b3, .bean.b4, .bean.b5 { display: none; }
  }
  @media (max-width: 340px) {
    .grid { grid-template-columns: 1fr; }
  }
  @media (prefers-reduced-motion: reduce) {
    html { scroll-behavior: auto; }
    .cat-head .line, .cat-head .hint::after { transition: none; }
  }
</style>
</head>
<body>
<a class="order-fab" id="orderFab" href="comanda.html" hidden aria-label="Comanda mea">
  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 8h12l-1 12H7L6 8z"/><path d="M9 8V6a3 3 0 0 1 6 0v2"/></svg>
  <span>Comanda mea</span><span class="badge" id="orderCount"></span>
</a>
<div class="deco" aria-hidden="true">
  <span class="ring r1"></span><span class="ring r2"></span><span class="ring r3"></span>
  <span class="bean b1"></span><span class="bean b2"></span><span class="bean b3"></span>
  <span class="bean b4"></span><span class="bean b5"></span><span class="bean b6"></span>
</div>
<div class="wrap">
  <header>
    <img class="logo" id="logo" src="assets/logo-mocha-cafe.webp" width="720" height="298" alt="Mocha">
    <h1>Meniu</h1>
  </header>
  <section class="banner" id="banner" hidden><img alt=""></section>
  <main id="meniu"><p class="state">Se încarcă meniul…</p></main>
  <footer id="footer" hidden>
    <img class="logo" src="assets/logo-mocha-cafe.webp" width="720" height="298" alt="">
    <div class="days" id="days"></div>
    <div class="hours" id="hours"></div>
  </footer>
</div>
<script src="assets/cart.js"></script>
<script>
(async () => {
  const main = document.getElementById('meniu');
  let data;
  try {
    const r = await fetch('data/menu.json', { cache: 'no-cache' });
    data = await r.json();
  } catch (e) {
    main.innerHTML = '<p class="state">Meniul nu a putut fi încărcat. Reîncercați.</p>';
    return;
  }
  const s = data.settings || {};
  const el = (tag, cls, text) => { const e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; };
  // Card colors repeat in this order: caramel, teal, caramel, dark / caramel, dark, teal, caramel
  const TONES = ['', 'teal', '', 'dark', '', 'dark', 'teal', ''];
  const ordering = (s.orders || {}).enabled !== false;
  const fab = document.getElementById('orderFab');
  const showCount = () => { const n = Cart.count(); document.getElementById('orderCount').textContent = n || ''; };
  let toastTimer;
  const toast = (text, undo) => {
    document.querySelector('.toast')?.remove();
    clearTimeout(toastTimer);
    const t = el('div', 'toast');
    t.setAttribute('role', 'status');
    t.append(el('span', null, text));
    if (undo) { const u = el('button', null, 'Anulează'); u.type = 'button'; u.onclick = () => { undo(); t.remove(); }; t.append(u); }
    document.body.append(t);
    toastTimer = setTimeout(() => t.remove(), Math.max(3500, text.length * 60));
  };
  // With "block products without stock" on, the server says how many pieces are left of each tracked product.
  const stockCheck = ordering && (s.orders || {}).stockCheck === true;
  let stock = {};
  const cards = new Map();
  const left = id => (stock && typeof stock[id] === 'number' ? stock[id] : Infinity);
  const askWaiter = i => {
    const name = i.name + (i.subheader ? ` (${i.subheader})` : '');
    const n = left(i.id);
    toast(n > 0 ? `Pentru produsul ${name} mai avem doar ${n} buc. Pentru mai multe, întreabă ospătarul.` : `Pentru produsul ${name} întreabă ospătarul.`);
  };
  const applyStock = () => {
    for (const [id, { card, item }] of cards) {
      const out = left(id) <= 0;
      card.classList.toggle('out', out);
      card.setAttribute('aria-label', out ? `${item.name}: întreabă ospătarul` : `Adaugă ${item.name} la comandă`);
      let ask = card.querySelector('.ask');
      if (out && !ask) card.append(ask = el('span', 'ask', 'Întreabă ospătarul'));
      if (!out && ask) ask.remove();
    }
  };
  const loadStock = async () => {
    if (!stockCheck) return;
    try {
      const d = await (await fetch('order.php?action=stock', { cache: 'no-store' })).json();
      if (d.ok) { stock = d.stock || {}; applyStock(); }
    } catch {}
  };
  const addToOrder = i => {
    if ((Cart.items()[i.id] || 0) + 1 > left(i.id)) { askWaiter(i); return; }
    Cart.add(i.id);
    showCount();
    fab.classList.remove('bump'); void fab.offsetWidth; fab.classList.add('bump');
    toast(`${i.name} adăugat la comandă`, () => { Cart.add(i.id, -1); showCount(); });
  };
  if (ordering) { fab.hidden = false; showCount(); }
  addEventListener('pageshow', showCount);

  if (s.title) document.title = s.title;
  // The default logo is served as an optimized WebP; only a different logo set in the menu data replaces it.
  if (s.logo && s.logo !== 'assets/Logo_mocha_800.png') document.querySelectorAll('.logo').forEach(i => i.src = s.logo);

  const b = s.banner || {};
  if (b.visible && b.image) {
    const box = document.getElementById('banner');
    box.querySelector('img').src = b.image;
    box.querySelector('img').alt = b.alt || '';
    box.hidden = false;
  }

  main.textContent = '';
  for (const c of data.categories || []) {
    const items = (c.items || []).filter(i => i.visible !== false);
    if (c.visible === false || !items.length) continue;
    const cat = el('section', 'cat');
    const btn = el('button', 'cat-head');
    btn.type = 'button';
    btn.setAttribute('aria-expanded', 'false');
    btn.append(el('span', 't', c.name), el('span', 'line'), el('span', 'hint', `${items.length} produse`));
    btn.onclick = () => { const o = cat.classList.toggle('open'); btn.setAttribute('aria-expanded', o); };
    const grid = el('div', 'grid');
    items.forEach((i, n) => {
      const card = el('article', 'card' + (TONES[n % TONES.length] ? ' ' + TONES[n % TONES.length] : ''));
      if (i.image) {
        const box = el('div', 'img');
        const im = el('img');
        im.src = i.image; im.alt = ''; im.loading = 'lazy';
        box.append(im);
        card.append(box);
      }
      if (i.price !== '' && i.price != null) {
        const p = el('div', 'price', i.price);
        p.append(el('span', null, s.currency || 'lei'));
        card.append(p);
      }
      card.append(el('h3', null, i.name));
      if (i.subheader) card.append(el('div', 'qty', i.subheader));
      if (i.description) card.append(el('p', null, i.description));
      if (ordering && priceCents(i.price) !== null) {
        card.classList.add('add');
        card.tabIndex = 0;
        card.setAttribute('role', 'button');
        card.setAttribute('aria-label', `Adaugă ${i.name} la comandă`);
        card.append(el('span', 'plus', '+'));
        cards.set(i.id, { card, item: i });
        card.onclick = () => addToOrder(i);
        card.onkeydown = e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); addToOrder(i); } };
      }
      grid.append(card);
    });
    cat.append(btn, grid);
    main.append(cat);
  }
  if (!main.children.length) main.innerHTML = '<p class="state">Meniul este momentan gol.</p>';
  loadStock();
  document.addEventListener('visibilitychange', () => { if (!document.hidden) loadStock(); });
  addEventListener('pageshow', e => { if (e.persisted) loadStock(); });

  const f = s.footer || {};
  if (f.days || f.hours) {
    document.getElementById('days').textContent = f.days || '';
    document.getElementById('hours').textContent = f.hours || '';
    document.getElementById('footer').hidden = false;
  }
})();
</script>
</body>
</html>
