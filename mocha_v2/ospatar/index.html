<!doctype html>
<html lang="ro">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>Ospătar | Mocha</title>
<style>
  :root {
    --bg: #f4f0ea;
    --card: #fff;
    --line: #e5ddd2;
    --text: #22170f;
    --muted: #7b6c60;
    --brand: #3a2218;
    --accent: #2e7a62;
    --accent-soft: #e4f1eb;
    --warn: #b45f06;
    --warn-soft: #fff1dc;
    --danger: #a3322a;
    --radius: 14px;
  }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  body { margin: 0; background: var(--bg); color: var(--text); font: 15px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
  button, input { font: inherit; color: inherit; }
  .btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; border: 1px solid var(--line); background: #fff; border-radius: 10px; padding: 9px 14px; cursor: pointer; font-weight: 600; white-space: nowrap; }
  .btn:hover { background: #faf7f3; }
  .btn.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
  .btn.primary:hover { background: #24624e; }
  .btn.danger { color: var(--danger); }
  .btn.sel { outline: 3px solid color-mix(in srgb, var(--accent) 35%, transparent); }
  .btn:disabled { opacity: .5; cursor: default; }

  /* Login */
  .login { min-height: 100vh; display: grid; place-items: center; padding: 16px; }
  .login form { width: min(360px, 100%); background: var(--card); border: 1px solid var(--line); border-radius: 16px; padding: 28px; display: grid; gap: 14px; }
  .login h1 { margin: 0; font-size: 22px; }
  .login input { width: 100%; border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; }
  .msg { font-size: 13.5px; padding: 8px 10px; border-radius: 8px; background: #fbe9e7; color: var(--danger); }
  .msg.info { background: var(--warn-soft); color: var(--warn); }

  /* Top bar */
  header { position: sticky; top: 0; z-index: 10; background: var(--brand); color: #fff; }
  .bar { max-width: 1200px; margin: 0 auto; padding: 10px 16px; display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
  .bar h1 { margin: 0; font-size: 17px; margin-right: auto; }
  .kpi { display: flex; gap: 16px; font-size: 13px; opacity: .92; }
  .kpi b { font-size: 16px; }
  .live { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; opacity: .85; }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: #5fd39b; box-shadow: 0 0 0 3px rgba(95, 211, 155, .25); }
  .live.off .dot { background: #e57373; box-shadow: 0 0 0 3px rgba(229, 115, 115, .25); }
  header .btn { background: transparent; color: #fff; border-color: rgba(255,255,255,.35); padding: 6px 12px; font-weight: 500; }
  header .btn:hover { background: rgba(255,255,255,.1); }

  main { max-width: 1200px; margin: 0 auto; padding: 16px 16px 60px; }
  .tables { display: grid; grid-template-columns: repeat(auto-fill, minmax(330px, 1fr)); gap: 14px; align-items: start; }
  .empty { text-align: center; color: var(--muted); padding: 60px 16px; font-size: 16px; }

  .table { background: var(--card); border: 1px solid var(--line); border-radius: var(--radius); overflow: hidden; }
  .table.asks { border-color: var(--warn); box-shadow: 0 0 0 2px var(--warn-soft); }
  .t-head { display: flex; align-items: center; gap: 10px; padding: 12px 14px; background: #faf6f1; border-bottom: 1px solid var(--line); }
  .t-head .no { font-size: 22px; font-weight: 800; letter-spacing: -.5px; }
  .t-head .sum { margin-left: auto; font-weight: 700; font-size: 17px; }
  .ask { display: flex; align-items: center; gap: 8px; padding: 9px 14px; background: var(--warn-soft); color: var(--warn); font-weight: 700; font-size: 14px; }

  .order { padding: 12px 14px; border-bottom: 1px dashed var(--line); }
  .order.new { animation: flash 2.4s ease; }
  @keyframes flash { 0%, 40% { background: #fff6c9; } 100% { background: transparent; } }
  .o-head { display: flex; align-items: baseline; gap: 8px; font-size: 13px; color: var(--muted); }
  .o-head b { color: var(--text); font-size: 14px; }
  .o-head .age.late { color: var(--danger); font-weight: 700; }
  .items { list-style: none; margin: 8px 0; padding: 0; }
  .items li { display: grid; grid-template-columns: 34px 1fr auto; gap: 6px; padding: 3px 0; }
  .items .q { font-weight: 800; }
  .items small { color: var(--muted); margin-left: 4px; }
  .items .p { color: var(--muted); font-size: 13.5px; }
  .o-foot { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
  .o-foot .tot { font-weight: 700; margin-right: auto; }
  .choice { display: flex; gap: 6px; flex-wrap: wrap; width: 100%; margin-top: 8px; padding: 8px; background: var(--accent-soft); border-radius: 10px; }
  .choice span { width: 100%; font-size: 13px; color: var(--accent); font-weight: 600; }
  .choice .btn { flex: 1; }
  .t-foot { padding: 12px 14px; display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
  .t-foot .choice { margin-top: 0; }

  .who { display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px; }
  .who button { border: 1px solid var(--line); background: #fff; border-radius: 10px; padding: 12px 8px; cursor: pointer; font-weight: 600; }
  .who button[aria-checked="true"] { background: var(--accent); border-color: var(--accent); color: #fff; }
  .bar h1 small { display: block; font-size: 12px; font-weight: 400; opacity: .85; }
  .modal { position: fixed; inset: 0; z-index: 60; background: rgba(20, 12, 6, .55); display: grid; place-items: center; padding: 16px; }
  .sheet { width: min(520px, 100%); max-height: calc(100vh - 32px); overflow: auto; background: #fff; border-radius: 16px; padding: 20px; }
  .sheet h2 { margin: 0 0 4px; font-size: 20px; }
  .sheet-actions { display: flex; gap: 8px; justify-content: flex-end; flex-wrap: wrap; margin-top: 16px; }
  .rk { display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px; margin: 12px 0; }
  .rk div { background: #faf6f1; border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; }
  .rk .big { grid-column: 1 / -1; background: var(--brand); color: #fff; border-color: var(--brand); }
  .rk b { display: block; font-size: 20px; }
  .rk span { font-size: 12.5px; color: var(--muted); }
  .rk .big span { color: rgba(255,255,255,.8); }
  .rt { width: 100%; border-collapse: collapse; font-size: 14px; margin-top: 6px; }
  .rt td { padding: 5px 4px; border-bottom: 1px solid var(--line); }
  .rt .n { text-align: right; white-space: nowrap; }
  .meta { font-size: 13px; color: var(--muted); }
  @media print {
    body > *:not(#printArea) { display: none !important; }
    #printArea { display: block !important; font-size: 12px; }
    .rk .big { background: #fff; color: #000; border-color: #000; }
    .rk .big span { color: #555; }
  }
  .toast { position: fixed; left: 50%; bottom: 20px; translate: -50% 0; background: #222; color: #fff; padding: 10px 16px; border-radius: 10px; font-size: 14px; z-index: 50; max-width: calc(100vw - 32px); }
  .toast.err { background: var(--danger); }
  @media (max-width: 560px) {
    .tables { grid-template-columns: 1fr; }
    .kpi { order: 9; width: 100%; }
  }
</style>
</head>
<body>

<section class="login" id="login" hidden>
  <form id="loginForm">
    <h1>Ospătar</h1>
    <div class="msg info" id="notConfigured" hidden>Nu există ospătari. Adaugă-i din <b>Administrare → Ospătari</b>.</div>
    <div class="who" id="who" role="radiogroup" aria-label="Alege numele tău"></div>
    <input type="password" id="password" autocomplete="current-password" placeholder="Parolă" required aria-label="Parolă">
    <div class="msg" id="loginErr" hidden></div>
    <button class="btn primary" type="submit">Intră</button>
  </form>
</section>

<div id="app" hidden>
  <header>
    <div class="bar">
      <h1><span id="meName"></span><small id="meShift"></small></h1>
      <div class="kpi"><span><b id="kOrders">0</b> comenzi deschise</span><span><b id="kTables">0</b> mese</span><span><b id="kTotal">0</b> de încasat</span></div>
      <span class="live" id="live"><span class="dot"></span><span id="liveText">Live</span></span>
      <button class="btn" id="soundBtn" aria-pressed="true">🔔 Sunet</button>
      <button class="btn" id="shiftBtn">Închide tura</button>
      <button class="btn" id="logoutBtn" title="Ieși fără să închizi tura">Ieșire</button>
    </div>
  </header>
  <main>
    <div class="tables" id="tables"></div>
    <p class="empty" id="empty" hidden>Nicio comandă deschisă. Comenzile noi apar aici automat.</p>
  </main>
</div>

<div class="modal" id="shiftModal" hidden role="dialog" aria-modal="true" aria-labelledby="shiftTitle">
  <div class="sheet">
    <h2 id="shiftTitle">Închidere tură</h2>
    <div id="shiftBody"></div>
    <div class="sheet-actions" id="shiftActions"></div>
  </div>
</div>
<div id="printArea" hidden></div>

<script>
const $ = id => document.getElementById(id);
const el = (tag, cls, text) => { const e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; };
const METHOD = { cash: 'Numerar', card: 'Card' };
let csrf = null;
let orders = [];
let currency = 'lei';
let serverNow = null;
let lastSig = '';
let seen = null;            // order ids already shown (null before the first load)
let fresh = new Set();      // ids to highlight on this render
let openChoice = null;      // 'o:<id>' or 't:<table>' whose payment choice is open
let sound = localStorage.getItem('mocha_waiter_sound') !== 'off';
let timer = null;

const money = c => { const v = c / 100; return (Number.isInteger(v) ? String(v) : v.toFixed(2).replace('.', ',')) + ' ' + currency; };
function toast(text, err) {
  const t = el('div', 'toast' + (err ? ' err' : ''), text);
  document.body.append(t);
  setTimeout(() => t.remove(), err ? 5000 : 2200);
}
async function api(action, body) {
  const r = await fetch('api.php?action=' + action, {
    method: body ? 'POST' : 'GET',
    credentials: 'same-origin',
    headers: { ...(csrf ? { 'X-CSRF-Token': csrf } : {}), ...(body ? { 'Content-Type': 'application/json' } : {}) },
    body: body ? JSON.stringify(body) : undefined,
  });
  let d;
  try { d = await r.json(); } catch { throw new Error('Răspuns invalid de la server (' + r.status + ').'); }
  if (r.status === 401 && action !== 'login') { closeModal(); backToLogin(); }
  if (!d.ok) throw new Error(d.error || 'Eroare.');
  return d;
}

/* ---------- sound ---------- */
let audio;
function beep() {
  if (!sound) return;
  try {
    audio ??= new (window.AudioContext || window.webkitAudioContext)();
    const t = audio.currentTime;
    for (const [i, f] of [[0, 880], [0.18, 1175]]) {
      const o = audio.createOscillator(), g = audio.createGain();
      o.frequency.value = f; o.type = 'sine';
      g.gain.setValueAtTime(0.0001, t + i);
      g.gain.exponentialRampToValueAtTime(0.25, t + i + 0.02);
      g.gain.exponentialRampToValueAtTime(0.0001, t + i + 0.16);
      o.connect(g).connect(audio.destination);
      o.start(t + i); o.stop(t + i + 0.17);
    }
  } catch {}
}
function paintSound() { $('soundBtn').textContent = sound ? '🔔 Sunet' : '🔕 Fără sunet'; $('soundBtn').setAttribute('aria-pressed', sound); }
$('soundBtn').onclick = () => { sound = !sound; localStorage.setItem('mocha_waiter_sound', sound ? 'on' : 'off'); paintSound(); if (sound) beep(); };

/* ---------- auth ---------- */
let chosen = null;
function showLogin(waiters) {
  $('app').hidden = true; $('login').hidden = false;
  if (waiters) {
    const box = $('who');
    box.textContent = '';
    $('notConfigured').hidden = waiters.length > 0;
    for (const w of waiters) {
      const b = el('button', null, w.name);
      b.type = 'button';
      b.setAttribute('role', 'radio');
      b.setAttribute('aria-checked', 'false');
      b.onclick = () => { chosen = w.id; box.querySelectorAll('button').forEach(x => x.setAttribute('aria-checked', x === b)); $('password').focus(); };
      box.append(b);
    }
    if (waiters.length === 1) box.firstChild.click();
  }
}
async function backToLogin() {
  stop(); csrf = null; seen = null; chosen = null;
  try { const st = await api('status'); showLogin(st.waiters); } catch { showLogin(); }
}
$('loginForm').addEventListener('submit', async e => {
  e.preventDefault();
  $('loginErr').hidden = true;
  if (!chosen) { $('loginErr').textContent = 'Alege-ți numele.'; $('loginErr').hidden = false; return; }
  try {
    const d = await api('login', { waiter: chosen, password: $('password').value });
    csrf = d.csrf;
    $('password').value = '';
    start();
  } catch (err) { $('loginErr').textContent = err.message; $('loginErr').hidden = false; }
});
$('logoutBtn').onclick = async () => { await api('logout').catch(() => {}); backToLogin(); };

/* ---------- shift ---------- */
const dt = d => d ? new Date(d.replace(' ', 'T')).toLocaleString('ro-RO', { day: '2-digit', month: '2-digit', hour: '2-digit', minute: '2-digit' }) : '';
function shiftView(r) {
  const box = el('div');
  box.append(el('p', 'meta', `${r.waiter} · ${dt(r.from)} – ${r.closed ? dt(r.to) : 'acum'}`));
  const k = el('div', 'rk');
  const kpi = (cls, val, label) => { const d = el('div', cls); d.append(el('b', null, val), el('span', null, label)); return d; };
  k.append(
    kpi('big', money(r.cash.cents), `Numerar de predat (${r.cash.count} comenzi)`),
    kpi('', money(r.card.cents), `Card (${r.card.count} comenzi)`),
    kpi('', money(r.paid.cents), `Total încasat (${r.paid.count} comenzi)`),
    kpi('', String(r.cancelled.count), `Comenzi anulate (${money(r.cancelled.cents)})`),
    kpi('', String(r.tables.length), 'Mese servite'));
  box.append(k);
  if (r.products.length) {
    box.append(el('b', null, 'Produse încasate'));
    const t = el('table', 'rt');
    for (const p of r.products) {
      const tr = el('tr');
      tr.append(el('td', null, p.name + (p.subheader ? ` (${p.subheader})` : '')), el('td', 'n', p.qty + ' buc.'), el('td', 'n', money(p.cents)));
      t.append(tr);
    }
    box.append(t);
  }
  return box;
}
function closeModal() { $('shiftModal').hidden = true; }
function printShift(r) {
  const h1 = el('h2', null, `Raport tură #${r.shift} – ${r.waiter}`);
  $('printArea').replaceChildren(h1, shiftView(r));
  $('printArea').hidden = false; window.print(); $('printArea').hidden = true;
}
$('shiftBtn').onclick = async () => {
  try {
    const { report } = await api('shift');
    $('shiftTitle').textContent = 'Închidere tură';
    $('shiftBody').replaceChildren(shiftView(report),
      el('p', 'meta', 'După închidere, raportul se salvează și ești delogat. Tura următoare începe la următoarea autentificare.'));
    const cancel = el('button', 'btn', 'Renunță'); cancel.onclick = closeModal;
    const ok = el('button', 'btn primary', 'Închide tura');
    ok.onclick = async () => {
      ok.disabled = true;
      try {
        const d = await api('shift_close', {});
        stop();
        $('shiftTitle').textContent = 'Tura a fost închisă';
        $('shiftBody').replaceChildren(shiftView(d.report));
        const pr = el('button', 'btn', 'Tipărește'); pr.onclick = () => printShift(d.report);
        const done = el('button', 'btn primary', 'Gata'); done.onclick = () => { closeModal(); backToLogin(); };
        $('shiftActions').replaceChildren(pr, done);
      } catch (err) { ok.disabled = false; toast(err.message, true); }
    };
    $('shiftActions').replaceChildren(cancel, ok);
    $('shiftModal').hidden = false;
  } catch (err) { toast(err.message, true); }
};

/* ---------- live polling ---------- */
function start() {
  $('login').hidden = true; $('app').hidden = false;
  paintSound();
  poll();
}
function stop() { clearTimeout(timer); timer = null; }
let polling = false;
async function poll() {
  clearTimeout(timer);
  if (polling) { timer = setTimeout(poll, 300); return; }  // one request at a time, so polling never doubles up
  polling = true;
  try {
    const d = await api('live');
    currency = d.currency || 'lei';
    serverNow = new Date(d.now.replace(' ', 'T'));
    orders = d.orders;
    $('meName').textContent = d.me.name;
    $('meShift').textContent = `Tura de la ${d.me.started_at.slice(11, 16)} · încasat ${money(d.me.paid_cents)} (numerar ${money(d.me.cash_cents)})`;
    $('live').classList.remove('off'); $('liveText').textContent = 'Live';
    const ids = orders.map(o => o.id);
    if (seen) {
      fresh = new Set(ids.filter(id => !seen.has(id)));
      if (fresh.size) beep();
    }
    seen = new Set(ids);
    const sig = JSON.stringify(orders.map(o => [o.id, o.pay_request]));
    if (sig !== lastSig || fresh.size) { lastSig = sig; render(); } else updateAges();
  } catch (e) {
    $('live').classList.add('off'); $('liveText').textContent = 'Fără conexiune';
  }
  polling = false;
  clearTimeout(timer);
  if (csrf) timer = setTimeout(poll, document.hidden ? 15000 : 4000);
}
document.addEventListener('visibilitychange', () => { if (!document.hidden && csrf) poll(); });

const ageMin = o => Math.max(0, Math.round((serverNow - new Date(o.created_at.replace(' ', 'T'))) / 60000));
function updateAges() {
  document.querySelectorAll('[data-age]').forEach(s => {
    const o = orders.find(x => x.id === +s.dataset.age);
    if (o) { const m = ageMin(o); s.textContent = m ? `acum ${m} min` : 'acum'; s.classList.toggle('late', m >= 15); }
  });
}

/* ---------- actions ---------- */
async function act(action, body, msg) {
  try {
    await api(action, body);
    openChoice = null;
    toast(msg);
  } catch (e) { toast(e.message, true); }
  lastSig = '';
  poll();
}
function payChoice(key, label, preset, onPick) {
  const box = el('div', 'choice');
  box.append(el('span', null, label));
  for (const m of ['cash', 'card']) {
    const b = el('button', 'btn primary' + (preset === m ? ' sel' : ''), METHOD[m]);
    b.onclick = () => onPick(m);
    box.append(b);
  }
  const c = el('button', 'btn', 'Renunță');
  c.onclick = () => { openChoice = null; render(); };
  box.append(c);
  return box;
}

/* ---------- render ---------- */
function render() {
  const byTable = new Map();
  for (const o of orders) {
    if (!byTable.has(o.table_no)) byTable.set(o.table_no, []);
    byTable.get(o.table_no).push(o);
  }
  const total = orders.reduce((a, o) => a + o.total_cents, 0);
  $('kOrders').textContent = orders.length;
  $('kTables').textContent = byTable.size;
  $('kTotal').textContent = money(total);
  document.title = (orders.length ? `(${orders.length}) ` : '') + 'Ospătar | Mocha';

  const box = $('tables');
  box.textContent = '';
  $('empty').hidden = orders.length > 0;
  for (const [table, list] of byTable) {
    const ask = list.find(o => o.pay_request)?.pay_request;
    const sum = list.reduce((a, o) => a + o.total_cents, 0);
    const card = el('section', 'table' + (ask ? ' asks' : ''));
    const head = el('div', 't-head');
    head.append(el('span', 'no', 'Masa ' + table), el('span', null, list.length === 1 ? '1 comandă' : `${list.length} comenzi`), el('span', 'sum', money(sum)));
    card.append(head);
    if (ask) card.append(el('div', 'ask', `🧾 Cere nota · ${ask === 'card' ? 'Card' : 'Cash'}`));

    for (const o of list) {
      const row = el('div', 'order' + (fresh.has(o.id) ? ' new' : ''));
      const oh = el('div', 'o-head');
      const t = o.created_at.slice(11, 16);
      const age = el('span', 'age'); age.dataset.age = o.id;
      oh.append(el('b', null, '#' + o.id), el('span', null, t), age);
      if (o.pay_request) oh.append(el('span', null, '· nota ' + (o.pay_request === 'card' ? 'card' : 'cash')));
      const ul = el('ul', 'items');
      for (const i of o.items) {
        const li = el('li');
        const n = el('span', null, i.name);
        if (i.subheader) n.append(el('small', null, i.subheader));
        li.append(el('span', 'q', i.qty + '×'), n, el('span', 'p', money(i.price_cents * i.qty)));
        ul.append(li);
      }
      const foot = el('div', 'o-foot');
      foot.append(el('span', 'tot', money(o.total_cents)));
      const cancel = el('button', 'btn danger', 'Anulare comandă');
      cancel.onclick = () => { if (confirm(`Anulezi comanda #${o.id} (masa ${table}, ${money(o.total_cents)})?`)) act('cancel', { id: o.id }, `Comanda #${o.id} a fost anulată.`); };
      const pay = el('button', 'btn primary', 'Plată comandă');
      pay.onclick = () => { openChoice = 'o:' + o.id; render(); };
      foot.append(cancel, pay);
      if (openChoice === 'o:' + o.id) {
        foot.append(payChoice(openChoice, `Încasează ${money(o.total_cents)} pentru #${o.id}:`, o.pay_request,
          m => act('pay', { id: o.id, method: m }, `Comanda #${o.id} plătită (${METHOD[m]}).`)));
      }
      row.append(oh, ul, foot);
      card.append(row);
    }

    if (list.length > 1) {
      const tf = el('div', 't-foot');
      if (openChoice === 't:' + table) {
        tf.append(payChoice(openChoice, `Încasează toată masa ${table}: ${money(sum)}`, ask,
          m => act('pay_table', { table, ids: list.map(o => o.id), method: m }, `Masa ${table} a fost plătită (${METHOD[m]}).`)));
      } else {
        const all = el('button', 'btn primary', `Plată masă · ${money(sum)}`);
        all.onclick = () => { openChoice = 't:' + table; render(); };
        tf.append(all);
      }
      card.append(tf);
    }
    box.append(card);
  }
  fresh = new Set();
  updateAges();
}

/* ---------- start ---------- */
(async () => {
  try {
    const st = await api('status');
    if (st.loggedIn) { csrf = st.csrf; start(); } else showLogin(st.waiters);
  } catch (e) {
    showLogin();
    $('loginErr').textContent = e.message;
    $('loginErr').hidden = false;
  }
})();
</script>
